name: Secret and data-file scan

on:
  push:
  pull_request:

permissions:
  contents: read
  # gitleaks lists a pull request's commits through the API. Without this it gets a 403 on every
  # pull_request run and scans nothing — a green tick for a check that never looked, which is worse
  # than a red one. The push run of the same commit does scan, which is what hid it.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  no-data-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a real data file type is tracked outside fixtures/
        run: |
          set -e
          hits=$(git ls-files | grep -Ei '\.(835|837|edi|x12|xlsx|xls|csv|tsv|pdf|docx?|db|sqlite3?|dump|pem|key|p12|pfx)$' | grep -Ev '^fixtures/' || true)
          if [ -n "$hits" ]; then
            echo "Tracked data/secret files found:"; echo "$hits"; exit 1
          fi
          echo "No data files tracked."
